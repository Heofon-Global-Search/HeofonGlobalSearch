name: Bot Contributor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bot-update:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Update file
        run: |
          echo "Bot updated this on $(date)" >> bot-update.txt

      - name: Save change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bot-update.txt
          git commit -m "Update by GitHub Actions bot"
          git push
